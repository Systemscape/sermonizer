version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    # Generated by dist; regenerate with `dist generate` instead, since `dist plan` rejects a modified file
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
