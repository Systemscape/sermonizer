name: Release-plz

on:
  push:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

# RELEASE_PLZ_TOKEN must be a PAT or GitHub App token: tags and PRs pushed with
# the default GITHUB_TOKEN do not trigger the dist release workflow or CI
jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Systemscape' }}
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_PLZ_TOKEN }}

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Run release-plz
      uses: release-plz/action@v0.5
      with:
        command: release
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Systemscape' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.RELEASE_PLZ_TOKEN }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@v1
      with:
        toolchain: stable

    - name: Run release-plz
      uses: release-plz/action@v0.5
      with:
        command: release-pr
      env:
        GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
